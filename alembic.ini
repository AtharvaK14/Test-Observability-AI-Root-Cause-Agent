# Alembic configuration.
#
# The database URL is NOT set here — env.py reads it from Settings, so there is
# one source of truth and no chance of migrating a different database than the
# application talks to. Set DATABASE_URL in the environment (or .env) instead.
#
#   alembic revision --autogenerate -m "add worker_id index"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os

# Timestamped, slugged filenames sort chronologically in a directory listing,
# which a bare hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format %(here)s/db/migrations/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
