# TEMPORARY. Delete once the deploy role's trust policy is set.
#
# Prints the claims of this repository's GitHub OIDC token so the AWS trust
# policy can match the real `sub` value instead of a guessed one (case matters:
# IAM StringEquals is case sensitive). Prints claims only, never the token.

name: OIDC claims (temporary)

on:
  workflow_dispatch:

permissions: {}

jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print token claims
        run: |
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::$token"
          payload="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          base64 -d <<<"$payload" | jq '{sub, aud, repository, repository_owner, repository_id, repository_owner_id, ref}'
