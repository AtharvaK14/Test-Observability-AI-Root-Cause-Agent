# CI for this repository: lint, type-check, test.
#
# The whole suite runs on in-memory SQLite with no API key and no network — so
# this workflow needs no services and no secrets, and a fork's PR runs it green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (StrEnum, `X | Y` at runtime). 3.13 catches
        # deprecations before they become breakage.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend/ scripts/

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Verify db/schema.sql matches the ORM
        # The schema is generated from the models, so a model change that skips
        # the regeneration step leaves docker-compose provisioning a database
        # the application cannot use. Catch it here rather than on someone's
        # first `docker compose up`.
        run: |
          python scripts/dump_schema.py > /tmp/schema.sql
          if ! diff -q db/schema.sql /tmp/schema.sql > /dev/null; then
            echo "::error::db/schema.sql is stale. Run: python scripts/dump_schema.py > db/schema.sql"
            diff db/schema.sql /tmp/schema.sql || true
            exit 1
          fi

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -f ci/docker/Dockerfile.backend -t tobs-api:ci .
      - name: Smoke-test the image
        # Proves the image can import the app — a missing runtime dependency
        # otherwise only surfaces when someone deploys it.
        run: |
          docker run --rm -e DATABASE_URL=sqlite+pysqlite:///:memory: tobs-api:ci \
            python -c "from backend.main import create_app; create_app(); print('app builds')"
